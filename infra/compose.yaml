# Local development data services. Apps run on the host in M0 (app images arrive in M11).
# Ports bind to 127.0.0.1 only. Usage: pnpm infra:up | pnpm infra:up:tracing | pnpm infra:down
name: commerce-ai-ops

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    # Coordination and cache only (design.md §2): persistence disabled on purpose.
    image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?copy .env.example to .env}',
        '--appendonly',
        'no',
        '--save',
        '',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?copy .env.example to .env}
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-56379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    # Optional OTLP trace backend for local inspection (UI on http://127.0.0.1:16686).
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    profiles: ['tracing']
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4318:4318'

volumes:
  postgres-data:
