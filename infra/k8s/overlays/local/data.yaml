# Local stand-ins for Azure Database for PostgreSQL and Azure Cache for Redis. Redis keeps no state
# on purpose (as in compose.prod.yaml): recovery rebuilds work from PostgreSQL.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
          env:
            - { name: POSTGRES_USER, value: commerce_admin }
            - { name: POSTGRES_DB, value: commerce }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/app/postgres_password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: [pg_isready, -U, commerce_admin, -d, commerce] }
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: secrets, mountPath: /run/secrets/app, readOnly: true }
      volumes:
        - name: secrets
          secret:
            secretName: commerce-app-secrets
            items:
              - { key: postgres_password, path: postgres_password }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: data
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
          command:
            - sh
            - -c
            - exec redis-server --requirepass "$(cat /run/secrets/app/redis_password)" --appendonly no --save ""
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/app, readOnly: true }
      volumes:
        - name: secrets
          secret:
            secretName: commerce-app-secrets
            items:
              - { key: redis_password, path: redis_password }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: data
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
# The private data network: only data-access pods (api, worker, mcp, migrate) reach the data
# services; the console (web) and the ingress controller cannot.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-access-only
  labels:
    app.kubernetes.io/component: data
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [postgres, redis] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              commerce.io/data-access: 'true'
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
