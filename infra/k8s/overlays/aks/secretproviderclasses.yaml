# Key Vault -> files through the Secrets Store CSI driver, authenticated with workload identity.
# One class per consumer so each pod only receives what it needs. Key Vault names use dashes;
# objectAlias gives the file name the apps expect. keyvaultName, tenantId and clientID come from
# params.env.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/component: platform
spec:
  provider: azure
  parameters:
    usePodIdentity: 'false'
    clientID: CLIENT-ID
    keyvaultName: KEY-VAULT
    tenantId: TENANT-ID
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
          objectAlias: database_url
        - |
          objectName: redis-url
          objectType: secret
          objectAlias: redis_url
        - |
          objectName: pii-key
          objectType: secret
          objectAlias: pii_key
        - |
          objectName: jwks
          objectType: secret
          objectAlias: jwks.json
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: web-secrets
  labels:
    app.kubernetes.io/component: platform
spec:
  provider: azure
  parameters:
    usePodIdentity: 'false'
    clientID: CLIENT-ID
    keyvaultName: KEY-VAULT
    tenantId: TENANT-ID
    objects: |
      array:
        - |
          objectName: issuer-private-jwk
          objectType: secret
          objectAlias: issuer-private.jwk.json
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: migrate-secrets
  labels:
    app.kubernetes.io/component: migrate
spec:
  provider: azure
  parameters:
    usePodIdentity: 'false'
    clientID: CLIENT-ID
    keyvaultName: KEY-VAULT
    tenantId: TENANT-ID
    objects: |
      array:
        - |
          objectName: database-admin-url
          objectType: secret
          objectAlias: database_admin_url
        - |
          objectName: database-migrator-url
          objectType: secret
          objectAlias: database_migrator_url
        - |
          objectName: database-url
          objectType: secret
          objectAlias: database_url
        - |
          objectName: pii-key
          objectType: secret
          objectAlias: pii_key
