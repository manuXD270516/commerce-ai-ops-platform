# Mirrors the private data network of compose.prod.yaml:
# - nothing enters the namespace except the ingress controller -> api/web and web -> api;
# - MCP accepts only in-namespace clients labelled commerce.io/mcp-client=true;
# - egress is denied except DNS, in-namespace traffic and, for pods labelled
#   commerce.io/data-access=true (api, worker, mcp, migrate; never web), the data services.
# Overlays set the ingress controller namespace and where the data services live.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/component: platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-namespace-egress
  labels:
    app.kubernetes.io/component: platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-to-api-and-web
  labels:
    app.kubernetes.io/component: platform
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [api, web] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: CHANGE-ME-ingress-namespace
      ports:
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 3001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-to-api
  labels:
    app.kubernetes.io/component: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - { protocol: TCP, port: 3001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-clients
  labels:
    app.kubernetes.io/component: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              commerce.io/mcp-client: 'true'
      ports:
        - { protocol: TCP, port: 3003 }
