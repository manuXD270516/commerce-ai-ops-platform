# In-cluster only: not routed by the ingress; MCP clients must run inside the namespace and carry
# the label commerce.io/mcp-client=true (see networkpolicies.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp
        commerce.io/data-access: 'true'
    spec:
      serviceAccountName: commerce-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: commerce-ai-ops/mcp:local
          ports:
            - { name: http, containerPort: 3003 }
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - { name: MCP_HOST, value: 0.0.0.0 }
            - { name: MCP_PORT, value: '3003' }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/app, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          secret:
            secretName: commerce-app-secrets
            items:
              - { key: database_url, path: database_url }
              - { key: redis_url, path: redis_url }
              - { key: pii_key, path: pii_key }
              - { key: jwks.json, path: jwks.json }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  labels:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: mcp
  ports:
    - { name: http, port: 3003, targetPort: http }
